<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'">
<meta name="robots" content="noindex">
<title>Pasero figure canvas</title>
<script src="fabric.min.js"></script>
<style>
:root{--ink:#14241f;--soft:#5d6e66;--line:#dfe5df;--bg:#f6f8f6;--violet:#8e73cf;--violet-bg:#f1ecfb;--violet-line:#cdbdf0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans CJK SC","Microsoft YaHei","Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;color:var(--ink);background:#fff;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#top{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap;row-gap:6px}
#title{border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:14px;font-weight:700;width:150px;background:transparent}
#title:hover,#title:focus{border-color:var(--line);outline:none;background:#fff}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tb{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-size:13px;line-height:1;min-width:30px;height:30px;display:inline-flex;align-items:center;gap:4px;justify-content:center}
.tb:hover{background:var(--bg);border-color:var(--line)}
.tb:disabled{opacity:.35;cursor:default;background:transparent;border-color:transparent}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;height:32px}
.pill:hover{background:var(--bg)}
.pill.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.primary:hover{background:#24372f}
.pill.ai{background:var(--violet-bg);border-color:var(--violet-line);color:#4b3796}
.spacer{flex:1}
#zoomv{font-size:12px;color:var(--soft);min-width:42px;text-align:center}
select.small{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;background:#fff;height:30px}
#aibar{display:none;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fbfaff;align-items:flex-start}
#aibar.open{display:flex}
#aiprompt{flex:1;min-height:52px;max-height:120px;border:1px solid var(--violet-line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical}
#aiinfo{font-size:12px;color:var(--soft);max-width:220px;line-height:1.4}
#main{display:grid;grid-template-columns:268px 1fr auto;min-height:0;flex:1}
#lib{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
#tabs{display:flex;gap:4px;padding:8px 8px 4px}
#tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 0;font-size:12px;font-weight:600}
#tabs button.on{background:var(--violet-bg);border-color:var(--violet-line)}
#search{margin:4px 8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
#cats{display:flex;gap:4px;flex-wrap:wrap;padding:2px 8px 6px;max-height:84px;overflow:auto}
#cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 8px;font-size:11px;white-space:nowrap}
#cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#grid{flex:1;overflow:auto;padding:4px 8px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.ic{border:1px solid transparent;border-radius:10px;padding:4px;text-align:center;font-size:10.5px;color:var(--soft);cursor:grab;background:#fff;line-height:1.2;overflow:hidden}
.ic:hover{border-color:var(--line);background:var(--bg)}
.ic img{width:100%;aspect-ratio:1;object-fit:contain;display:block;pointer-events:none}
.ic span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tpl{grid-column:span 3;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:#fff}
.tpl:hover{border-color:var(--violet-line);background:#fbfaff}
.tpl img{width:100%;display:block;border-radius:6px;background:#fff}
.tpl b{display:block;font-size:12px;margin-top:4px}
.tpl small{display:block;font-size:11px;color:var(--soft)}
.note{grid-column:span 3;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12.5px;background:#fff}
.note:hover{border-color:var(--violet-line);background:#fbfaff}
.note small{display:block;color:var(--soft);font-size:11px;margin-top:2px}
.empty{grid-column:span 3;color:var(--soft);font-size:12px;padding:12px 4px;line-height:1.5}
#more{grid-column:span 3}
#stage{position:relative;overflow:auto;background:var(--bg);min-height:0}
#stageInner{min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
#canvasWrap{box-shadow:0 1px 3px rgba(20,36,31,.12),0 10px 30px rgba(20,36,31,.08);background:#fff;line-height:0}
#props{width:0;overflow:hidden;border-left:1px solid var(--line);background:#fff;transition:width .12s}
#props.open{width:236px;overflow:auto}
#propsIn{padding:10px 12px;width:236px}
.ph{font-size:12px;font-weight:700;color:var(--soft);margin:12px 0 6px}
.ph:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:12.5px}
.row label{flex:1;color:var(--soft)}
.row input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:#fff}
.row input[type=number]{width:62px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12.5px}
.row select{border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:12px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 2px;font-size:11.5px}
.btns button:hover{background:var(--bg)}
.credit{font-size:11px;color:var(--soft);line-height:1.4;margin-top:8px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:999px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#busy{position:absolute;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-size:13px;color:var(--soft);z-index:4}
#busy.show{display:flex}
#menu{position:absolute;display:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,36,31,.12);padding:4px;z-index:10;min-width:150px}
#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;font-size:13px}
#menu button:hover{background:var(--bg)}

a.pill{display:inline-flex;align-items:center;text-decoration:none}
html,body{height:100%}
#app{border:0;border-radius:0}
@media (max-width:760px){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:260px minmax(0,1fr)}
  #lib,#stage{min-width:0}
  #cats{flex-wrap:nowrap;overflow-x:auto;max-height:none;padding-bottom:8px}
  #grid{grid-auto-rows:min-content}
  #lib{border-right:0;border-bottom:1px solid var(--line)}
  #grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .tpl,.empty,#more{grid-column:span 5}
  #props.open{position:absolute;right:0;top:0;bottom:0;z-index:6;box-shadow:-8px 0 24px rgba(20,36,31,.12)}
  #stage{min-height:320px}
  #title{width:110px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <input id="title" spellcheck="false">
    <div class="sep"></div>
    <button class="tb" id="undo" data-tip="undo">↶</button>
    <button class="tb" id="redo" data-tip="redo">↷</button>
    <div class="sep"></div>
    <button class="tb" id="addText" data-tip="text">T</button>
    <button class="tb" id="addArrow" data-tip="arrow">→</button>
    <button class="tb" id="addLine" data-tip="line">─</button>
    <button class="tb" id="addRect" data-tip="rect">▭</button>
    <button class="tb" id="addEllipse" data-tip="ellipse">◯</button>
    <div class="sep"></div>
    <button class="tb" id="zoomOut">−</button><span id="zoomv">100%</span><button class="tb" id="zoomIn">+</button>
    <button class="tb" id="zoomFit" data-tip="fit">⤢</button>
    <select class="small" id="size"></select>
    <div class="sep"></div>
        <div class="spacer"></div>
    <button class="pill" id="newBtn"></button>
    <button class="pill" id="exportBtn"></button>
    <a class="pill primary" id="ctaBtn" href="../../download.html?src=figure-tool" target="_top" rel="noopener"></a>
  </div>
  <div id="main">
    <div id="lib">
      <div id="tabs"><button data-tab="icons" class="on"></button><button data-tab="templates"></button></div>
      <input id="search">
      <div id="cats"></div>
      <div id="grid"></div>
    </div>
    <div id="stage"><div id="stageInner"><div id="canvasWrap"><canvas id="c"></canvas></div></div><div id="toast"></div><div id="busy"></div></div>
    <div id="props"><div id="propsIn"></div></div>
  </div>
</div>
<div id="menu"></div>
<script src="app.js"></script>
</body>
</html>
